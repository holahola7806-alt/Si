<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c1425">
<title>Ragdoll Bow Arena</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101c;font-family:system-ui,Segoe UI,Arial,sans-serif;color:white}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}#screen{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(155deg,#080f20b8,#091525bd);z-index:10;padding:14px;overflow:auto}#screen.hide{display:none} .panel{width:min(560px,96vw);max-height:94vh;overflow:auto;background:linear-gradient(145deg,#1b2a43f5,#0e1728f7);border:1px solid #ffffff29;border-radius:24px;box-shadow:0 25px 85px #000a;padding:25px;text-align:center;backdrop-filter:blur(8px)}.logo{font-size:clamp(30px,6vw,54px);font-weight:1000;line-height:1;letter-spacing:-2px;text-shadow:0 5px #0007}.gold{color:#ffcf58}.sub{font-size:13px;letter-spacing:2.5px;color:#a9bdd5;font-weight:800;margin:12px 0 21px}.help{font-size:14px;line-height:1.65;color:#b6c6dc;margin:12px auto 20px;max-width:455px}button{border:0;border-radius:13px;background:#e9b948;color:#172236;padding:12px 18px;font-weight:1000;font-size:15px;cursor:pointer;box-shadow:inset 0 -4px #b5822b;transition:transform .1s,filter .1s}button:hover{filter:brightness(1.1)}button:active{transform:translateY(2px)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.buttons button:first-child{grid-column:span 2;font-size:18px;padding:15px}.secondary{background:#283b55;color:#d8e8ff;box-shadow:inset 0 -4px #17263a}.row{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.shop{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.item{border:1px solid #48617b;border-radius:13px;padding:12px;background:#15243a;text-align:left}.item b{display:block;font-size:15px}.item small{color:#9fb3ca;display:block;min-height:37px;margin:6px 0;font-size:12px;line-height:1.4}.item button{width:100%;font-size:13px}.hint{font-size:12px;color:#95a9c3;margin-top:12px}.pill{padding:7px 12px;background:#293a55;border-radius:40px;font-size:13px;font-weight:900}.mobile{display:none;position:absolute;inset:0;z-index:4;pointer-events:none}.mobile button{pointer-events:auto;box-shadow:none;border:1px solid #ffffff40;background:#13243abf;color:white;border-radius:14px;font-size:22px;width:57px;height:57px;padding:0;backdrop-filter:blur(5px)}.pad{position:absolute;bottom:28px;left:18px;display:flex;gap:9px}.jump{position:absolute;bottom:92px;left:50px}.fire{position:absolute;bottom:29px;right:24px;width:77px!important;height:77px!important;border-radius:50%!important;background:#da9239d8!important;font-size:15px!important}.topButtons{position:absolute;top:17px;right:16px;z-index:5;display:flex;gap:7px}.topButtons button{padding:8px 11px;font-size:13px;border-radius:10px;background:#13243bc9;color:white;box-shadow:none;border:1px solid #ffffff24}.typeBtns{position:absolute;right:17px;bottom:124px;display:flex;gap:7px}.typeBtns button{width:45px;height:45px;font-size:20px}.typeBtns button.selected{outline:3px solid #ffce60}.touchHint{position:absolute;right:22px;bottom:215px;color:#e6e8ef;font-size:11px;text-align:right;text-shadow:0 2px 3px #000;font-weight:800;line-height:1.5}.hidden{display:none!important}@media(pointer:coarse){.mobile{display:block}}@media(max-width:420px){.panel{padding:16px}.help{font-size:12px}.item{padding:9px}.item small{min-height:45px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="topButtons" id="topBar" style="display:none"><button id="muteBtn">🔊</button><button id="pauseBtn">Ⅱ PAUSA</button></div>
<div class="mobile" id="mobile"><div class="pad"><button data-hold="left">◀</button><button data-hold="right">▶</button></div><div class="jump"><button data-hold="jump">⤴</button></div><div class="typeBtns"><button data-type="normal" class="selected">🏹</button><button data-type="fire">🔥</button><button data-type="ice">❄️</button></div><div class="touchHint">APUNTA ARRASTRANDO<br>EN LA PANTALLA</div><button class="fire" id="mobileFire">TIRAR</button></div>
<div id="screen"><div class="panel" id="panel"></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=1280,H=720,ground=646;
let sx=1,sy=1,offX=0,offY=0,DPR=1,last=0,clock=0,shake=0,mode='menu',difficulty='campaign',paused=false,wave=0,kills=0,coins=0,totalCoins=0,score=0,best=+(localStorage.getItem('rba_best')||0),muted=false,selected='normal',upgrades={damage:0,health:0,rate:0,arrows:0},player=null,enemies=[],shots=[],particles=[],texts=[],decor=[],spawning=[],aim={x:950,y:320},charging=false,charge=0,hold={left:false,right:false,jump:false},keys={},nextWaveTime=0;
const screen=document.querySelector('#screen'),panel=document.querySelector('#panel'),topBar=document.querySelector('#topBar'),mobile=document.querySelector('#mobile');
function resize(){DPR=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*DPR;canvas.height=innerHeight*DPR;sx=Math.min(innerWidth/W,innerHeight/H);offX=(innerWidth-W*sx)/2;offY=(innerHeight-H*sx)/2;ctx.setTransform(DPR*sx,0,0,DPR*sx,DPR*offX,DPR*offY)}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function sound(freq=300,dur=.07,kind='triangle',vol=.04){if(muted)return;try{const ac=sound.ac||(sound.ac=new(window.AudioContext||window.webkitAudioContext)());const o=ac.createOscillator(),g=ac.createGain();o.type=kind;o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.55),ac.currentTime+dur);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur+.008)}catch(e){}}
function show(html){screen.classList.remove('hide');panel.innerHTML=html;topBar.style.display='none';mobile.classList.add('hidden')}
function close(){screen.classList.add('hide');topBar.style.display='flex';mobile.classList.remove('hidden')}
function menu(){mode='menu';paused=false;show(`<div class="logo">RAGDOLL<br><span class="gold">BOW ARENA</span></div><div class="sub">⚔️ BATALLAS DE ARQUEROS ⚔️</div><p class="help">Dispara flechas con física, derrota arqueros, esquiva ataques y mejora tu equipo. ¡Cada enemigo cae como un auténtico ragdoll!</p><div class="buttons"><button id="start">▶ CAMPAÑA</button><button class="secondary" id="endless">∞ SUPERVIVENCIA</button><button class="secondary" id="how">❔ CÓMO JUGAR</button></div><p class="hint">Récord: ${best} puntos · Juego original en un solo HTML · Funciona sin internet</p>`);document.querySelector('#start').onclick=()=>start('campaign');document.querySelector('#endless').onclick=()=>start('endless');document.querySelector('#how').onclick=how}
function how(){show(`<div class="logo" style="font-size:32px">CÓMO <span class="gold">JUGAR</span></div><div class="help" style="text-align:left"><b>🖱️ PC</b><br>• Mueve el mouse para apuntar.<br>• Mantén clic izquierdo para tensar el arco; suelta para disparar.<br>• A/D o ←/→: moverte. W, ↑ o Espacio: saltar.<br>• Teclas 1, 2, 3: flecha normal, fuego o hielo.<br>• P o Escape: pausa.<br><br><b>📱 CELULAR</b><br>• Arrastra por la pantalla para apuntar y cargar, suelta para disparar.<br>• Botones ◀ ▶ y ⤴ para moverte/saltar.<br>• Botón TIRAR: apunta automáticamente al rival más cercano.<br><br><b>🔥 Flechas especiales</b><br>• Fuego: daño adicional (cuesta 3 monedas).<br>• Hielo: ralentiza enemigos (cuesta 2 monedas).<br>• Normal: gratis.</div><button id="back">← VOLVER</button>`);document.querySelector('#back').onclick=menu}
function fighter(x,y,kind='player'){let data={player:{hp:115,r:14,col:'#58c8ff',armor:'#347fc0',speed:1},scout:{hp:52,r:12,col:'#ffb86e',armor:'#bc5642',speed:1.05},archer:{hp:80,r:13,col:'#ef817e',armor:'#b83c55',speed:1},tank:{hp:168,r:16,col:'#b6a0ff',armor:'#7150ad',speed:.65},boss:{hp:340,r:19,col:'#ffdd75',armor:'#c5842c',speed:.82}}[kind];let hp=data.hp+(kind==='player'?upgrades.health*28:0);if(kind!=='player'){let m=1+Math.max(0,wave-1)*.11;hp=Math.round(hp*m)}return{x,y,vx:0,vy:0,r:data.r,hp,maxHp:hp,col:data.col,armor:data.armor,speed:data.speed,kind,face:kind==='player'?1:-1,grounded:false,dead:false,rag:null,fireCooldown:rand(.7,1.9),aimAngle:0,walk:rand(0,8),stun:0,burn:0,freeze:0,deadTimer:0,headshot:false,shield:0}}
function start(kind){difficulty=kind;mode='playing';paused=false;wave=0;kills=0;coins=0;totalCoins=0;score=0;selected='normal';upgrades={damage:0,health:0,rate:0,arrows:0};player=fighter(180,ground-42);enemies=[];shots=[];particles=[];texts=[];spawning=[];charging=false;charge=0;aim={x:800,y:360};nextWave()}
function nextWave(){wave++;mode='playing';close();player.hp=clamp(player.hp+20,0,player.maxHp);player.x=clamp(player.x,80,450);let n=difficulty==='campaign'?Math.min(2+wave,8):Math.min(3+Math.floor(wave*1.2),12);if(wave%5===0)n=Math.min(3+Math.floor(wave/5),6);spawning=[];for(let i=0;i<n;i++){let kind;if(wave%5===0&&i===n-1)kind='boss';else {let r=Math.random();kind=wave<2?'scout':wave<4?(r<.5?'archer':'scout'):(r<.16?'tank':r<.74?'archer':'scout')};spawning.push({time:.5+i*1.3,kind})}floatText(W/2,130,`OLEADA ${wave}`, '#ffe49b',38);sound(520,.17)}
function upgradesMenu(){mode='shop';shots=[];let items=[['damage','⚔️ PODER',`+20% de daño por nivel`,40+upgrades.damage*35],['health','❤️ SALUD',`+28 de vida máxima y curación`,45+upgrades.health*35],['rate','⚡ RECARGA',`Tensa el arco más rápido`,35+upgrades.rate*35],['arrows','🎯 DOBLE TIRO',`Desbloquea flechas adicionales`,85+upgrades.arrows*95]];show(`<div class="sub">OLEADA ${wave} SUPERADA</div><div class="logo" style="font-size:35px">¡BUEN <span class="gold">TRABAJO!</span></div><div class="row" style="margin:16px"><span class="pill">🪙 ${coins} monedas</span><span class="pill">🏆 ${score} puntos</span><span class="pill">❤️ ${Math.ceil(player.hp)}/${player.maxHp}</span></div><div class="shop">${items.map(([id,name,desc,cost])=>`<div class="item"><b>${name} <span style="color:#ffd57b">Nv.${upgrades[id]}</span></b><small>${desc}</small><button data-up="${id}" ${coins<cost||upgrades[id]>=4?'disabled':''}>${upgrades[id]>=4?'MÁXIMO':`🪙 ${cost}`}</button></div>`).join('')}</div><button id="continue">▶ SIGUIENTE OLEADA</button><p class="hint">La vida se recupera parcialmente entre oleadas.</p>`);document.querySelector('#continue').onclick=nextWave;document.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>{let id=el.dataset.up;let cost=items.find(x=>x[0]===id)[3];if(coins<cost||upgrades[id]>=4)return;coins-=cost;upgrades[id]++;if(id==='health'){player.maxHp+=28;player.hp=clamp(player.hp+48,0,player.maxHp)}sound(690,.12);upgradesMenu()})}
function gameOver(){mode='over';let newBest=score>best;if(newBest){best=score;try{localStorage.setItem('rba_best',best)}catch(e){}}show(`<div class="sub">FIN DE LA PARTIDA</div><div class="logo">BATALLA <span class="gold">TERMINADA</span></div><div class="row" style="margin:23px"><span class="pill">🌊 Oleada ${wave}</span><span class="pill">🏹 ${kills} bajas</span><span class="pill">🏆 ${score} puntos</span></div><p class="help">${newBest?'🎉 ¡Nuevo récord!':'Tu mejor puntuación: '+best} · ${difficulty==='campaign'?'Campaña':'Supervivencia'}</p><div class="buttons"><button id="retry">↻ REINTENTAR</button><button class="secondary" id="home">⌂ MENÚ</button><button class="secondary" id="switch">⇄ CAMBIAR MODO</button></div>`);document.querySelector('#retry').onclick=()=>start(difficulty);document.querySelector('#home').onclick=menu;document.querySelector('#switch').onclick=()=>start(difficulty==='campaign'?'endless':'campaign')}
function togglePause(){if(mode==='playing'){paused=true;mode='paused';charging=false;show(`<div class="logo" style="font-size:42px">EN <span class="gold">PAUSA</span></div><p class="help">Oleada ${wave} · ${kills} enemigos derrotados · ${score} puntos</p><div class="buttons"><button id="resume">▶ CONTINUAR</button><button class="secondary" id="restart">↻ REINICIAR</button><button class="secondary" id="quit">⌂ MENÚ</button></div>`);document.querySelector('#resume').onclick=resume;document.querySelector('#restart').onclick=()=>start(difficulty);document.querySelector('#quit').onclick=menu}else if(mode==='paused')resume()}
function resume(){paused=false;mode='playing';close()}
function floatText(x,y,t,color='#fff',size=18){texts.push({x,y,t,color,size,life:1.25,max:1.25})}
function burst(x,y,col,count=12,power=150){for(let i=0;i<count;i++){let a=rand(0,Math.PI*2),sp=rand(25,power);particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.25,.75),max:.75,col,r:rand(2,5)})}}
function ragdoll(f){if(f.rag)return;let sc=f.r/14,x=f.x,y=f.y;let pts=[[x,y-19*sc],[x,y-36*sc],[x,y+5*sc],[x-12*sc,y-17*sc],[x+12*sc,y-17*sc],[x-22*sc,y+4*sc],[x+22*sc,y+4*sc],[x-9*sc,y+28*sc],[x+9*sc,y+28*sc],[x-12*sc,y+48*sc],[x+12*sc,y+48*sc]].map(([px,py])=>({x:px,y:py,ox:px-f.vx/60+rand(-3,3),oy:py-f.vy/60+rand(-3,3)}));const bonds=[[0,1],[0,2],[0,3],[0,4],[3,5],[4,6],[2,7],[2,8],[7,9],[8,10],[3,4],[7,8],[3,2],[4,2]];f.rag={pts,bonds:bonds.map(([a,b])=>({a,b,len:dist(pts[a],pts[b])})),life:8};f.deadTimer=0}
function updateRag(f,dt){const r=f.rag;if(!r)return;let steps=Math.min(2,Math.max(1,Math.round(dt*60)));for(let st=0;st<steps;st++){for(let p of r.pts){let vx=(p.x-p.ox)*.994,vy=(p.y-p.oy)*.994;p.ox=p.x;p.oy=p.y;p.x+=vx;p.y+=vy+0.29;if(p.y>ground){p.y=ground;p.oy=p.y+vy*.26;p.x=clamp(p.x,10,W-10)}}for(let j=0;j<5;j++)for(let b of r.bonds){let a=r.pts[b.a],c=r.pts[b.b],dx=c.x-a.x,dy=c.y-a.y,len=Math.hypot(dx,dy)||1,err=(len-b.len)/len*.50;let vx=dx*err,vy=dy*err;a.x+=vx;a.y+=vy;c.x-=vx;c.y-=vy}}f.deadTimer+=dt}
function shoot(owner,power=1,type='normal',auto=false){if(!owner||owner.dead)return;let target;if(owner===player){if(auto){target=[...enemies].filter(e=>!e.dead).sort((a,b)=>dist(a,player)-dist(b,player))[0];if(!target){sound(120,.06);return}target={x:target.x,y:target.y-20}}else target=aim}else{target=player?{x:player.x+player.vx*.38,y:player.y-20+player.vy*.18}:null}if(!target)return;let ox=owner.x+owner.face*15,oy=owner.y-23;let dx=target.x-ox,dy=target.y-oy;if(owner!==player){dy-=Math.abs(dx)*.065;dx+=rand(-24,24)*(1+Math.min(wave,15)*-.035);dy+=rand(-38,38)}let len=Math.hypot(dx,dy)||1,dirX=dx/len,dirY=dy/len;if(owner===player){owner.face=dirX>=0?1:-1;if(type!=='normal'){let cost=type==='fire'?3:2;if(coins<cost){floatText(owner.x,owner.y-80,'SIN MONEDAS','#ff8585');sound(130,.07);return}coins-=cost}}owner.aimAngle=Math.atan2(dirY,dirX);let speed=(owner===player?670:rand(430,540))*(owner===player?(.58+power*.42):1);let extra=owner===player?Math.min(upgrades.arrows,3):0;for(let i=0;i<=extra;i++){let angle=owner.aimAngle+(i-extra/2)*.105,vx=Math.cos(angle)*speed,vy=Math.sin(angle)*speed;shots.push({x:ox+vx*.025,y:oy+vy*.025,px:ox,py:oy,vx,vy,owner,type,life:4,damage:(owner===player?32*(1+upgrades.damage*.2):Math.min(36,12+wave*1.5))*(type==='fire'?1.12:1),hit:false})}burst(ox,oy,'#fff2c8',4,55);sound(type==='fire'?265:540,.10,'sawtooth',.025)}
function damage(f,amount,x,y,arrow){if(f.dead)return;let headshot=y<f.y-31*(f.r/14);let amt=amount*(headshot?1.8:1);if(f.kind==='tank'||f.kind==='boss')amt*=.88;f.hp=Math.max(0,f.hp-amt);f.vx+=(arrow.vx>0?1:-1)*Math.min(160,amt*3);f.vy-=Math.min(120,amt*2.4);f.stun=.12;f.headshot=headshot;floatText(f.x+rand(-18,18),f.y-55,`${headshot?'🎯 ':''}-${Math.round(amt)}`,headshot?'#ffe26e':'#fff',headshot?24:18);burst(x,y,arrow.type==='fire'?'#ff9b3e':arrow.type==='ice'?'#b3f5ff':'#ff736b',headshot?15:8,115);shake=clamp(shake+ (headshot?7:3),0,16);if(arrow.type==='fire')f.burn=2.7;if(arrow.type==='ice')f.freeze=2.5;sound(headshot?710:210,.11,'square',.025);if(f.hp<=0){f.dead=true;ragdoll(f);if(f!==player){let reward=f.kind==='boss'?60:f.kind==='tank'?21:f.kind==='archer'?13:9;kills++;coins+=reward;totalCoins+=reward;score+=reward*10+Math.floor(100*(f.kind==='boss'?3:1));floatText(f.x,f.y-100,`+${reward} 🪙`,'#ffda66',24);burst(f.x,f.y-20,'#ffc86e',25,230);sound(130,.25)}else {floatText(f.x,f.y-112,'DERROTADO','#ff8a8a',30);setTimeout(()=>{if(mode==='playing'&&player.dead)gameOver()},1100)}}}
function stepFighter(f,dt){if(f.dead){updateRag(f,dt);return}f.walk+=dt*7;f.stun=Math.max(0,f.stun-dt);f.freeze=Math.max(0,f.freeze-dt);if(f.burn>0){f.burn-=dt;f.hp-=dt*2.5;if(Math.random()<dt*17)burst(f.x+rand(-12,12),f.y-rand(8,49),'#ff9c31',1,50);if(f.hp<=0)damage(f,1,f.x,f.y,{vx:1,type:'fire'})}
let dir=0,jump=false;if(f===player){dir=+!!(hold.right||keys.d||keys.ArrowRight)-+!!(hold.left||keys.a||keys.ArrowLeft);jump=!!(hold.jump||keys.w||keys.ArrowUp||keys[' '])}else{if(!player.dead){let delta=player.x-f.x;if(Math.abs(delta)>rand(285,310))dir=Math.sign(delta);else if(Math.abs(delta)<125)dir=-Math.sign(delta);f.face=delta>0?1:-1;if(f.grounded&&Math.random()<dt*.12&&Math.abs(delta)>400)jump=true}f.fireCooldown-=dt*(f.freeze>0?.45:1);if(f.fireCooldown<=0&&!player.dead&&Math.abs(player.x-f.x)<1000){shoot(f);f.fireCooldown=(f.kind==='scout'?2.35:f.kind==='archer'?1.35:f.kind==='tank'?2.1:.72)+rand(.1,.8)}}if(f.stun<=0){f.vx+=dir*1800*dt*(f.freeze>0?.35:1)*f.speed;if(f===player&&dir)f.face=dir;if(jump&&f.grounded){f.vy=-560;f.grounded=false;sound(330,.065)}}f.vx*=Math.pow(f.grounded?.80:.987,dt*60);f.vx=clamp(f.vx,-(f===player?315:175)*f.speed,(f===player?315:175)*f.speed);f.vy+=1350*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.x=clamp(f.x,23,W-23);if(f.y>=ground-44){f.y=ground-44;f.vy=0;f.grounded=true}else f.grounded=false}
function segmentDistance(px,py,ax,ay,bx,by){let dx=bx-ax,dy=by-ay,t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function tick(dt){clock+=dt;shake*=Math.pow(.83,dt*60);for(let f of [player,...enemies])if(f)stepFighter(f,dt);if(mode==='playing'){for(let s of spawning){s.time-=dt;if(s.time<=0&&!s.done){s.done=true;let e=fighter(rand(860,1180),ground-44,s.kind);enemies.push(e);burst(e.x,e.y-20,e.col,16,150);sound(190,.07)}}if(charging)charge=clamp(charge+dt*(.86+upgrades.rate*.22),0,1);if(spawning.length&&spawning.every(s=>s.done)&&enemies.every(e=>e.dead)){nextWaveTime+=dt;if(nextWaveTime>1.8){nextWaveTime=0;upgradesMenu()}}else nextWaveTime=0}
for(let a of shots){if(a.hit)continue;a.life-=dt;a.px=a.x;a.py=a.y;a.vy+=460*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.life<=0||a.x<0||a.x>W||a.y>ground){a.hit=true;if(a.y>ground)burst(a.x,ground,'#c5ad7a',5,80);continue}let targets=a.owner===player?enemies:[player];for(let t of targets){if(!t||t.dead)continue;let rad=t.r,hit=segmentDistance(t.x,t.y-19,a.px,a.py,a.x,a.y)<rad+11||segmentDistance(t.x,t.y-37,a.px,a.py,a.x,a.y)<rad*.85;if(hit){a.hit=true;damage(t,a.damage,a.x,a.y,a);break}}}shots=shots.filter(a=>!a.hit);for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}particles=particles.filter(p=>p.life>0);for(let t of texts){t.life-=dt;t.y-=dt*46}texts=texts.filter(t=>t.life>0);enemies=enemies.filter(e=>!e.dead||e.deadTimer<7)}
function background(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#142d4b');sky.addColorStop(.60,'#4b6c89');sky.addColorStop(1,'#95a58e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8d9';ctx.globalAlpha=.62;ctx.beginPath();ctx.arc(1030,110,59,0,7);ctx.fill();ctx.globalAlpha=1;for(let i=0;i<8;i++){let x=(i*230+clock*2)%(W+350)-140,y=80+i%3*80;ctx.fillStyle='#c0cfe1aa';ctx.beginPath();ctx.ellipse(x,y,88,21,0,0,7);ctx.ellipse(x+44,y-9,59,18,0,0,7);ctx.fill()}ctx.fillStyle='#375a6b';ctx.beginPath();ctx.moveTo(0,460);for(let x=0;x<=W;x+=60)ctx.lineTo(x,430+Math.sin(x*.009)*65+Math.cos(x*.024)*15);ctx.lineTo(W,ground);ctx.lineTo(0,ground);ctx.fill();ctx.fillStyle='#284b5c';ctx.beginPath();ctx.moveTo(0,520);for(let x=0;x<=W;x+=30)ctx.lineTo(x,500+Math.sin(x*.016+1)*38+Math.cos(x*.03)*10);ctx.lineTo(W,ground);ctx.lineTo(0,ground);ctx.fill();for(let i=0;i<19;i++){let x=i*77+25,h=randSeed(i)*48+37;ctx.fillStyle='#263d4b';ctx.fillRect(x,ground-85-h,11,h+70);ctx.beginPath();ctx.fillStyle='#1c4550';ctx.arc(x+4,ground-84-h,24+randSeed(i+20)*19,0,7);ctx.fill()}ctx.fillStyle='#3b6045';ctx.fillRect(0,ground-10,W,18);ctx.fillStyle='#29382c';ctx.fillRect(0,ground+8,W,H-ground);for(let i=0;i<110;i++){let x=(i*137)%W,y=ground+17+((i*37)%(H-ground-15));ctx.fillStyle=i%4?'#415039':'#58634b';ctx.fillRect(x,y,randSeed(i+4)*13+3,2)}for(let i=0;i<26;i++){let x=i*54;ctx.strokeStyle=i%2?'#8da35b':'#739357';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,ground-9);ctx.lineTo(x-4,ground-18-randSeed(i)*8);ctx.stroke()}}
function randSeed(n){return (Math.sin(n*127.1+48.37)*43758.5453)%1<0?1+((Math.sin(n*127.1+48.37)*43758.5453)%1):((Math.sin(n*127.1+48.37)*43758.5453)%1)}
function limb(ax,ay,bx,by,col,width){ctx.lineCap='round';ctx.strokeStyle='#172435';ctx.lineWidth=width+5;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}
function ragDraw(f){const p=f.rag.pts,pt=i=>p[i];let sc=f.r/14;for(let [a,b,w] of [[0,2,21],[0,1,11],[3,5,8],[4,6,8],[2,7,10],[2,8,10],[7,9,8],[8,10,8]])limb(pt(a).x,pt(a).y,pt(b).x,pt(b).y,f.col,w*sc);ctx.fillStyle=f.armor;ctx.beginPath();ctx.arc(pt(0).x,pt(0).y,13*sc,0,7);ctx.fill();ctx.fillStyle='#f4ca9b';ctx.beginPath();ctx.arc(pt(1).x,pt(1).y,12*sc,0,7);ctx.fill();ctx.fillStyle=f.armor;ctx.beginPath();ctx.arc(pt(1).x,pt(1).y-5*sc,13*sc,Math.PI,7);ctx.fill()}
function drawFighter(f){if(f.rag){ragDraw(f);return}let sc=f.r/14,x=f.x,y=f.y,bob=f.grounded?Math.sin(f.walk*1.6)*Math.min(2,Math.abs(f.vx)*.012):0,step=Math.sin(f.walk*1.8)*Math.min(13,Math.abs(f.vx)*.055),d=f.face;ctx.save();ctx.translate(x,y+bob);ctx.scale(sc,sc);limb(-7,0,-10+step,38,f.col,9);limb(7,0,11-step,38,f.col,9);limb(-10+step,38,-7+step,44,'#27394d',11);limb(11-step,38,8-step,44,'#27394d',11);limb(0,-31,0,1,f.col,21);ctx.fillStyle=f.armor;ctx.fillRect(-12,-30,24,27);ctx.fillStyle='#1a293b';ctx.fillRect(-11,-5,22,7);limb(-8,-26,-18*d,-7,f.col,9);ctx.fillStyle='#f4c996';ctx.beginPath();ctx.arc(0,-47,13,0,7);ctx.fill();ctx.fillStyle=f.armor;ctx.beginPath();ctx.arc(0,-51,14,Math.PI,Math.PI*2);ctx.lineTo(14,-46);ctx.lineTo(-14,-46);ctx.fill();ctx.fillStyle='#142336';ctx.fillRect(d*3,-49,4,3);ctx.fillStyle='#fff';ctx.fillRect(d*6,-49,2,2);let ang=f===player?(charging?Math.atan2(aim.y-(f.y-23),aim.x-(f.x+f.face*15)):(f.aimAngle||f.face>0?f.aimAngle:Math.PI)):Math.atan2(player.y-20-(f.y-23),player.x-f.x);if(!Number.isFinite(ang))ang=0;let handX=Math.cos(ang)*24,handY=-24+Math.sin(ang)*24;limb(9*d,-26,handX,handY,f.col,9);ctx.strokeStyle='#bd8546';ctx.lineWidth=5;ctx.beginPath();let bowX=handX+Math.cos(ang)*7,bowY=handY+Math.sin(ang)*7;ctx.save();ctx.translate(bowX,bowY);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(0,-29);ctx.quadraticCurveTo(14,0,0,29);ctx.stroke();ctx.strokeStyle='#fff5d5';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-29);ctx.lineTo(charging&&f===player?-16*charge:0,0);ctx.lineTo(0,29);ctx.stroke();ctx.restore();ctx.restore();if(f.freeze>0){ctx.strokeStyle='#9bebff99';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y-25,30,0,7);ctx.stroke()}if(f!==player&&!f.dead){ctx.fillStyle='#131e2a';ctx.fillRect(x-32,y-80,64,7);ctx.fillStyle=f.kind==='boss'?'#e8af42':'#f17b68';ctx.fillRect(x-31,y-79,62*f.hp/f.maxHp,5);if(f.kind==='boss'){ctx.textAlign='center';ctx.fillStyle='#ffe89a';ctx.font='bold 15px system-ui';ctx.fillText('★ JEFE ★',x,y-88)}}}
function drawArrow(a){let angle=Math.atan2(a.vy,a.vx);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(angle);if(a.type==='fire'){ctx.shadowColor='#ff8f2a';ctx.shadowBlur=13}else if(a.type==='ice'){ctx.shadowColor='#a1efff';ctx.shadowBlur=13}ctx.strokeStyle=a.type==='fire'?'#ff9c43':a.type==='ice'?'#9eeafa':'#e9c693';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-23,0);ctx.lineTo(10,0);ctx.stroke();ctx.fillStyle='#d5e4ed';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(5,-5);ctx.lineTo(5,5);ctx.fill();ctx.strokeStyle=a.type==='fire'?'#ff6b21':'#e0f0fa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-21,0);ctx.lineTo(-28,-6);ctx.moveTo(-21,0);ctx.lineTo(-28,6);ctx.stroke();ctx.restore()}
function hud(){ctx.fillStyle='#111b2acc';round(16,15,285,94,15);ctx.fill();ctx.fillStyle='#f9fcff';ctx.font='900 18px system-ui';ctx.textAlign='left';ctx.fillText('🏹  ARQUERO',32,42);ctx.fillStyle='#344058';round(33,55,250,15,6);ctx.fill();ctx.fillStyle=player.hp/player.maxHp<.3?'#ff6767':'#55d696';round(33,55,250*clamp(player.hp/player.maxHp,0,1),15,6);ctx.fill();ctx.font='bold 13px system-ui';ctx.fillStyle='#f9fcff';ctx.fillText(`❤️ ${Math.ceil(player.hp)} / ${player.maxHp}`,36,86);ctx.fillStyle='#111b2acc';round(370,15,560,60,15);ctx.fill();ctx.font='900 23px system-ui';ctx.fillStyle='#ffdfa1';ctx.textAlign='center';ctx.fillText(`OLEADA ${wave}`,W/2,41);ctx.font='bold 14px system-ui';ctx.fillStyle='#d4e0ee';ctx.fillText(`🏹 ${kills} bajas     🪙 ${coins} monedas     🏆 ${score} puntos`,W/2,62);ctx.fillStyle='#111b2acc';round(950,15,235,77,15);ctx.fill();ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText('FLECHAS  [ 1 · 2 · 3 ]',967,37);ctx.font='bold 16px system-ui';ctx.fillStyle=selected==='normal'?'#ffdd80':selected==='fire'?'#ff9b5c':'#9eeaff';ctx.fillText(selected==='normal'?'🏹 NORMAL  •  GRATIS':selected==='fire'?'🔥 FUEGO  •  3 🪙':'❄️ HIELO  •  2 🪙',967,64);if(charging){ctx.fillStyle='#061627a8';round(483,610,314,20,9);ctx.fill();ctx.fillStyle=charge>.9?'#7fe4af':'#ffe09a';round(487,614,306*charge,12,6);ctx.fill();ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('POTENCIA',W/2,603)}if(wave%5===0){let boss=enemies.find(e=>e.kind==='boss'&&!e.dead);if(boss){ctx.fillStyle='#172535bd';round(382,103,516,30,12);ctx.fill();ctx.fillStyle='#e6a540';round(390,111,500*boss.hp/boss.maxHp,14,7);ctx.fill();ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('JEFE DE OLEADA',W/2,99)}}}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),h,r)}
function draw(){ctx.save();ctx.clearRect(-offX/sx,-offY/sx,innerWidth/sx,innerHeight/sx);ctx.save();ctx.translate(rand(-shake,shake),rand(-shake,shake));background();if(player)drawFighter(player);for(let e of enemies)drawFighter(e);for(let a of shots)drawArrow(a);for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;for(let t of texts){ctx.globalAlpha=clamp(t.life/t.max,0,1);ctx.fillStyle='#0b1529';ctx.textAlign='center';ctx.font=`900 ${t.size}px system-ui`;ctx.fillText(t.t,t.x+2,t.y+3);ctx.fillStyle=t.color;ctx.fillText(t.t,t.x,t.y)}ctx.globalAlpha=1;if(mode==='playing'&&player&&!player.dead&&charging){let a=Math.atan2(aim.y-(player.y-23),aim.x-(player.x+15)),px=player.x+player.face*15,py=player.y-23,speed=670*(.58+charge*.42);for(let i=1;i<23;i++){let t=i*.071,xx=px+Math.cos(a)*speed*t,yy=py+Math.sin(a)*speed*t+230*t*t;if(yy>ground)break;ctx.globalAlpha=.65*(1-i/24);ctx.fillStyle='#ffecb2';ctx.beginPath();ctx.arc(xx,yy,Math.max(1,3-i*.08),0,7);ctx.fill()}ctx.globalAlpha=1}ctx.restore();if(player&&['playing','shop','paused','over'].includes(mode))hud();ctx.restore()}
function loop(tm){let dt=Math.min((tm-last)/1000||.016,.04);last=tm;if(mode==='playing')tick(dt);else{clock+=dt*.35;for(let f of enemies)if(f.dead)updateRag(f,dt);for(let p of particles)p.life-=dt;particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(loop)}
function point(e){return{x:(e.clientX-offX)/sx,y:(e.clientY-offY)/sx}}
function selectType(t){selected=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('selected',b.dataset.type===t));sound(450,.04)}
function finishShot(auto=false){if(!charging&& !auto)return;let p=auto?1:charge;charging=false;charge=0;if(mode==='playing')shoot(player,clamp(p,.1,1),selected,auto)}
canvas.addEventListener('pointerdown',e=>{if(mode!=='playing'||player.dead)return;if(e.pointerType==='mouse'&&e.button!==0)return;canvas.setPointerCapture(e.pointerId);aim=point(e);charging=true;charge=.03});canvas.addEventListener('pointermove',e=>{if(mode==='playing'&&(!('ontouchstart'in window)||charging))aim=point(e)});canvas.addEventListener('pointerup',()=>finishShot());canvas.addEventListener('pointercancel',()=>{charging=false;charge=0});canvas.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true;if((e.key==='Escape'||e.key.toLowerCase()==='p')&&!e.repeat)togglePause();if(e.key==='1')selectType('normal');if(e.key==='2')selectType('fire');if(e.key==='3')selectType('ice');if(e.key==='Enter'&&mode==='playing'&&!e.repeat)finishShot(true)});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});addEventListener('blur',()=>{keys={};hold={left:false,right:false,jump:false};charging=false});
document.querySelectorAll('[data-hold]').forEach(el=>{let k=el.dataset.hold;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);hold[k]=true});for(let evt of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(evt,e=>{e.preventDefault();hold[k]=false})});document.querySelectorAll('[data-type]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();selectType(el.dataset.type)}));document.querySelector('#mobileFire').addEventListener('pointerdown',e=>{e.preventDefault();finishShot(true)});document.querySelector('#pauseBtn').onclick=togglePause;document.querySelector('#muteBtn').onclick=()=>{muted=!muted;document.querySelector('#muteBtn').textContent=muted?'🔇':'🔊'};
menu();requestAnimationFrame(loop);
})();
</script></body></html>
