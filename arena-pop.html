<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arena Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{background:linear-gradient(180deg,#5b3fd6 0%,#3a239c 55%,#24145f 100%);font-family:'Nunito',system-ui,sans-serif;color:#fff;
       display:flex;justify-content:center;align-items:flex-start}
  #app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;width:100%}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{background:rgba(0,0,0,.28);border-radius:999px;padding:6px 14px;font-family:'Lilita One',cursive;font-size:20px;display:flex;align-items:center;gap:6px;
        box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
  .pill.low{background:#d93a4a;animation:pulse .5s infinite alternate}
  @keyframes pulse{to{transform:scale(1.06)}}
  .lvl{font-family:'Lilita One',cursive;font-size:22px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  .icon{width:38px;height:38px;border-radius:12px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
  .icon:active{transform:scale(.92)}
  #board{position:relative;padding:8px;border-radius:22px;background:linear-gradient(180deg,#8f7cff,#6a52e6);
         box-shadow:0 14px 34px rgba(0,0,0,.45), inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.2)}
  #cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:14px 14px 0 0}
  #grid{position:relative;background:#2c1f78;border-radius:0 0 14px 14px;overflow:visible}
  .slotc{position:absolute;padding:3px}
  .slotc i{display:block;width:100%;height:100%;border-radius:10px;background:#251a68;box-shadow:inset 0 3px 6px rgba(0,0,0,.35)}
  .blk{position:absolute;padding:3px;transition:left .09s ease-out, top .09s ease-out;cursor:grab;touch-action:none;z-index:2}
  .blk.drag{z-index:10;transition:left .06s linear, top .06s linear}
  .blk.drag .box{transform:scale(1.04);box-shadow:0 10px 18px rgba(0,0,0,.45), inset 0 0 0 4px var(--c)}
  .box{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;background:#1d1550;
       box-shadow:inset 0 0 0 4px var(--c), inset 0 0 0 6px rgba(0,0,0,.25), 0 4px 0 rgba(0,0,0,.3);transition:transform .1s}
  .box::before{content:'';position:absolute;inset:7px;border-radius:7px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25))}
  .fill{position:absolute;left:6px;right:6px;bottom:6px;height:0;border-radius:0 0 6px 6px;background:var(--c);
        background-image:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.4px),radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.4px);
        background-size:5px 5px,7px 7px;background-position:0 0,2px 3px;transition:height .12s linear}
  .box::after{content:'';position:absolute;left:7px;right:7px;top:7px;height:5px;border-radius:4px;background:rgba(255,255,255,.22)}
  .pct{position:absolute;right:9px;bottom:7px;font-weight:900;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.7);z-index:2}
  .blk.top .box{animation:glowTop 1s ease-in-out infinite alternate}
  @keyframes glowTop{to{box-shadow:inset 0 0 0 4px var(--c), inset 0 0 0 6px rgba(0,0,0,.25), 0 0 14px var(--c)}}
  .blk.pop{animation:popOut .35s ease-in forwards;pointer-events:none}
  @keyframes popOut{40%{transform:scale(1.15)}100%{transform:scale(0);opacity:0}}
  .float-txt{position:absolute;font-family:'Lilita One',cursive;font-size:22px;pointer-events:none;z-index:30;text-shadow:0 3px 0 rgba(0,0,0,.4);
             animation:rise .9s ease-out forwards;transform:translate(-50%,-50%)}
  @keyframes rise{0%{opacity:0;margin-top:10px}20%{opacity:1}100%{opacity:0;margin-top:-50px}}
  #over{position:fixed;inset:0;background:rgba(20,10,60,.75);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
  #over.show{display:flex;animation:fade .3s}
  @keyframes fade{from{opacity:0}}
  .card{background:linear-gradient(160deg,#7d66ff,#4b33c4);padding:26px 30px;border-radius:24px;text-align:center;min-width:250px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .card h2{font-family:'Lilita One',cursive;font-size:32px;margin:0 0 8px;font-weight:400}
  .card p{margin:0 0 16px;font-weight:700;opacity:.9}
  .play{font-family:'Lilita One',cursive;font-size:22px;border:none;border-radius:16px;padding:12px 30px;cursor:pointer;color:#2b1a6b;
        background:linear-gradient(180deg,#ffe07a,#ffb21e);box-shadow:0 5px 0 #c97a00}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 #c97a00}
  .hint{font-size:12px;opacity:.65;text-align:center;padding:0 12px;max-width:440px}
  #boost{display:flex;justify-content:space-between;gap:8px}
  .bst{flex:1;position:relative;border:none;border-radius:16px;padding:6px 0 5px;cursor:pointer;color:#fff;font-family:'Nunito',sans-serif;
       background:linear-gradient(180deg,#8a74ff,#5a40d8);box-shadow:0 4px 0 #3a2596, inset 0 2px 0 rgba(255,255,255,.3);
       display:flex;flex-direction:column;align-items:center;gap:1px}
  .bst .em{font-size:24px;line-height:1.1}
  .bst .nm{font-size:10px;font-weight:900;opacity:.9}
  .bst .cnt{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3d6e;
            font-size:12px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .bst .cnt.buy{background:#ffb21e;color:#3b2412}
  .bst:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2596}
  .bst.on{background:linear-gradient(180deg,#ffe07a,#ffb21e);color:#3b2412;box-shadow:0 4px 0 #c97a00;animation:pulse .5s infinite alternate}
  #mode{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#ffb21e;color:#3b2412;font-weight:900;padding:10px 16px;border-radius:14px;
        z-index:60;display:none;box-shadow:0 6px 16px rgba(0,0,0,.35);white-space:nowrap}
  #mode.show{display:block;animation:fade .2s}
  body.targeting .blk{cursor:crosshair}
  body.targeting.vac .blk .box{animation:wob .4s infinite alternate}
  @keyframes wob{to{transform:scale(.95)}}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(15,8,45,.92);padding:10px 16px;border-radius:14px;font-weight:800;
         z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  .blk.hinted .box{animation:hintB .45s infinite alternate}
  @keyframes hintB{to{box-shadow:inset 0 0 0 4px #fff, 0 0 18px #fff}}
  .hintGhost{position:absolute;border:3px dashed #fff;border-radius:12px;z-index:5;pointer-events:none;animation:pulse .45s infinite alternate}
  .boom{position:absolute;border-radius:50%;pointer-events:none;z-index:40;transform:translate(-50%,-50%);
        background:radial-gradient(circle,#fff 0%,#ffe07a 30%,#ff7a2e 60%,rgba(255,60,30,0) 72%);animation:boom .5s ease-out forwards}
  @keyframes boom{from{width:10px;height:10px;opacity:1}to{width:260px;height:260px;opacity:0}}
  .shake{animation:shake .35s}
  @keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
  .blk.suck .box{animation:suck .35s ease-in forwards}
  @keyframes suck{to{transform:scale(1.12) rotate(8deg)}}
  .icon.ready{background:linear-gradient(180deg,#ffe07a,#ffb21e);animation:pulse .6s infinite alternate}
  .rewards{list-style:none;padding:0;margin:0 0 16px;font-weight:800;line-height:1.7}
  .sec{font-family:'Lilita One',cursive;font-size:18px;border:none;border-radius:14px;padding:10px 20px;cursor:pointer;color:#fff;margin-top:10px;
       background:linear-gradient(180deg,#4cd37a,#22a552);box-shadow:0 4px 0 #157a3a;display:none}
  .sec.show{display:inline-block}
</style>
<style>
#gjBackHome{position:fixed;z-index:210;bottom:max(11px,env(safe-area-inset-bottom));left:max(9px,env(safe-area-inset-left));border:1px solid #ffffff6e;border-radius:99px;background:#191336e8;color:white;padding:9px 13px;font:bold 12px system-ui;box-shadow:0 4px 16px #0008;cursor:pointer;touch-action:manipulation}
#gjBackHome:active{transform:scale(.94)}
</style></head>
<body>
<div id="app">
  <div class="hud" id="hud">
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="lvl" id="lvl">Nivel 1</div>
    <div class="pill" id="timerPill">⏱ <span id="timer">0:00</span></div>
  </div>
  <div id="board">
    <canvas id="cv"></canvas>
    <div id="grid"></div>
  </div>
  <div id="boost">
    <button class="bst" data-b="vac"><span class="em">🌀</span><span class="nm">Aspiradora</span><span class="cnt"></span></button>
    <button class="bst" data-b="bomb"><span class="em">💣</span><span class="nm">Bomba</span><span class="cnt"></span></button>
    <button class="bst" data-b="hint"><span class="em">💡</span><span class="nm">Pista</span><span class="cnt"></span></button>
    <button class="bst" data-b="time"><span class="em">⏳</span><span class="nm">+20 seg</span><span class="cnt"></span></button>
  </div>
  <div class="hud" id="hud2">
    <div class="hint">Sube una caja a la fila de arriba: se bebe la arena de su color que tenga encima.</div>
    <div style="display:flex;gap:8px">
      <button class="icon" id="gift" aria-label="Regalo diario">🎁</button>
      <button class="icon" id="snd">🔊</button>
      <button class="icon" id="rst">↻</button>
    </div>
  </div>
</div>

<div id="over"><div class="card">
  <h2 id="ovT">¡Nivel completado!</h2>
  <div id="ovP"></div>
  <button class="play" id="ovB">Siguiente</button><br>
  <button class="sec" id="ovB2">+20 seg</button>
</div></div>
<div id="mode"></div>
<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const COLS = 6, ROWS = 6, G = 16, W = COLS * G, HP = 84, SH = 16;
  const COLORS = [
    { hex: '#ff4d5e', rgb: [242, 62, 82] },
    { hex: '#ffcf33', rgb: [255, 204, 40] },
    { hex: '#3d9bff', rgb: [52, 142, 255] },
    { hex: '#45d468', rgb: [56, 200, 92] },
    { hex: '#ff6fd0', rgb: [240, 92, 200] },
    { hex: '#ff9433', rgb: [255, 138, 36] },
    { hex: '#a875ff', rgb: [150, 96, 245] },
  ];
  const rgba = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  const cl = v => Math.max(0, Math.min(255, Math.round(v)));
  const PAL = COLORS.map(({ rgb: [r, g, b] }) => Array.from({ length: SH }, (_, s) => {
    const f = 0.74 + (s / (SH - 1)) * 0.4; return rgba(cl(r * f), cl(g * f), cl(b * f));
  }));

  // ---------- Canvas ----------
  const cv = $('cv'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = HP;
  const img = ctx.createImageData(W, HP), buf = new Uint32Array(img.data.buffer);
  const bg = new Uint32Array(W * HP);
  for (let i = 0; i < W * HP; i++) { const n = Math.random() * 26; bg[i] = rgba(226 + n * 0.8, 222 + n * 0.8, 236 + n * 0.6); }
  const sand = new Uint8Array(W * HP), shade = new Uint8Array(W * HP);

  // ---------- State ----------
  let level = 1, coins = 0, blocks = [], occ = [], timeLeft = 0, state = 'play', cell = 60, gpx = 4;
  try { level = +localStorage.getItem('arenapop-level') || 1; coins = +localStorage.getItem('arenapop-coins') || 0; } catch (e) {}
  const BOOST = {
    vac:  { icon: '🌀', name: 'Aspiradora', price: 150 },
    bomb: { icon: '💣', name: 'Bomba', price: 120 },
    hint: { icon: '💡', name: 'Pista', price: 60 },
    time: { icon: '⏳', name: '+20 seg', price: 80 },
  };
  let inv = { vac: 2, bomb: 2, hint: 3, time: 2 }, mode = null;
  try { const s = JSON.parse(localStorage.getItem('arenapop-inv') || 'null'); if (s) inv = Object.assign(inv, s); } catch (e) {}
  const save = () => { try {
    localStorage.setItem('arenapop-level', level); localStorage.setItem('arenapop-coins', coins);
    localStorage.setItem('arenapop-inv', JSON.stringify(inv));
  } catch (e) {} };

  const gridEl = $('grid');
  const slotEls = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const d = document.createElement('div'); d.className = 'slotc'; d.appendChild(document.createElement('i'));
    d.dataset.r = r; d.dataset.c = c; gridEl.appendChild(d); slotEls.push(d);
  }

  // ---------- Level generation ----------
  const SHAPES = [[1, 2], [2, 1], [1, 2], [2, 1], [1, 3], [3, 1], [2, 2], [1, 1]]; // [w,h]
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function buildLevel() {
    const nColors = Math.min(3 + Math.floor((level - 1) / 2), COLORS.length);
    const palette = shuffle([...Array(COLORS.length).keys()]).slice(0, nColors);
    // pack grid
    const g = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
    const list = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (g[r][c] >= 0) continue;
      const opts = shuffle(SHAPES.slice());
      let placed = false;
      for (const [w, h] of opts) {
        if (r + h > ROWS || c + w > COLS) continue;
        let ok = true;
        for (let y = 0; y < h && ok; y++) for (let x = 0; x < w; x++) if (g[r + y][c + x] >= 0) { ok = false; break; }
        if (!ok) continue;
        const id = list.length;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) g[r + y][c + x] = id;
        list.push({ r, c, w, h });
        placed = true; break;
      }
      if (!placed) { g[r][c] = list.length; list.push({ r, c, w: 1, h: 1 }); }
    }
    // remove a few blocks to make room (more room on early levels)
    // leave enough free cells so boxes can always slide around
    const minFree = level <= 2 ? 9 : 7;
    const order0 = shuffle(list.map((_, i) => i));
    const removable = []; let free = 0;
    for (const i of order0) { if (free >= minFree || list.length - removable.length <= 4) break; removable.push(i); free += list[i].w * list[i].h; }
    const kept = list.filter((_, i) => !removable.includes(i));
    // colors: make sure each palette color appears
    const order = shuffle(kept.map((_, i) => i));
    order.forEach((bi, n) => kept[bi].k = n < nColors ? palette[n] : palette[Math.random() * nColors | 0]);
    // avoid a solved-looking top row: at most 2 blocks in top row match the bottom band later (fine as is)
    const T = kept.reduce((s, b) => s + b.w * b.h, 0);
    const cap = Math.floor(W * HP * 0.78 / T);
    blocks = kept.map((b, i) => ({ ...b, id: i, cap: cap * b.w * b.h, fill: 0, dead: false, el: null }));
    occ = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
    blocks.forEach(b => setOcc(b, b.id));

    // ---- sand picture with exact amounts ----
    sand.fill(0);
    const parts = [];
    palette.forEach(k => {
      const total = blocks.filter(b => b.k === k).reduce((s, b) => s + b.cap, 0);
      if (!total) return;
      if (total > cap * 3 && Math.random() < 0.7) { const a = Math.floor(total * (0.35 + Math.random() * 0.3)); parts.push([k, a], [k, total - a]); }
      else parts.push([k, total]);
    });
    for (let t = 0; t < 30; t++) { shuffle(parts); if (parts.every((p, i) => !i || p[0] !== parts[i - 1][0])) break; }
    const style = level % 4;
    const amp = 4 + Math.random() * 7, freq = 0.05 + Math.random() * 0.07, ph = Math.random() * 6.28, slope = (Math.random() < 0.5 ? -1 : 1) * (0.15 + Math.random() * 0.2);
    const keyOf = (x, y) => {
      const up = HP - 1 - y;
      if (style === 0) return up + amp * Math.sin(x * freq + ph);
      if (style === 1) return up + slope * (x - W / 2) + 3 * Math.sin(x * 0.2 + ph);
      if (style === 2) return up - 0.28 * Math.abs(x - W / 2) + 2.5 * Math.sin(x * 0.3 + ph);
      return up + amp * 0.7 * Math.sin(x * freq + ph) + 3 * Math.sin(x * 0.23);
    };
    const idx = [];
    for (let y = 0; y < HP; y++) for (let x = 0; x < W; x++) idx.push([keyOf(x, y) + Math.random() * 0.8, y * W + x]);
    idx.sort((a, b) => a[0] - b[0]);
    let p = 0;
    for (const [k, n] of parts) for (let j = 0; j < n && p < idx.length; j++, p++) {
      const i = idx[p][1]; sand[i] = k + 1; shade[i] = 3 + (Math.random() * 12 | 0);
    }
    for (let s = 0; s < 400; s++) if (!step()) break;   // let it settle
    timeLeft = 75 + T * 4;
    state = 'play'; setMode(null); clearHint();
    buildBlockEls();
    layout();
    $('lvl').textContent = 'Nivel ' + level;
    $('over').classList.remove('show');
  }

  function setOcc(b, v) { for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) occ[b.r + y][b.c + x] = v; }

  // ---------- Blocks UI ----------
  function buildBlockEls() {
    gridEl.querySelectorAll('.blk').forEach(e => e.remove());
    blocks.forEach(b => {
      const el = document.createElement('div');
      el.className = 'blk';
      el.style.setProperty('--c', COLORS[b.k].hex);
      el.innerHTML = '<div class="box"><div class="fill"></div><span class="pct">0%</span></div>';
      el.addEventListener('pointerdown', e => startDrag(b, e));
      gridEl.appendChild(el);
      b.el = el; b.fillEl = el.querySelector('.fill'); b.pctEl = el.querySelector('.pct');
    });
  }
  function posBlock(b) {
    b.el.style.left = b.c * cell + 'px'; b.el.style.top = b.r * cell + 'px';
    b.el.style.width = b.w * cell + 'px'; b.el.style.height = b.h * cell + 'px';
    b.el.classList.toggle('top', b.r === 0);
  }
  function updFill(b) {
    const pct = Math.min(100, Math.floor(b.fill / b.cap * 100));
    b.fillEl.style.height = `calc(${pct}% - ${pct * 0.12}px)`;
    b.pctEl.textContent = pct + '%';
  }

  function layout() {
    const availH = window.innerHeight - 235;
    const ratio = HP / W + ROWS / COLS;
    const bw = Math.floor(Math.min(window.innerWidth * 0.94 - 16, 430, availH / ratio));
    cell = bw / COLS; gpx = bw / W;
    cv.style.width = bw + 'px'; cv.style.height = HP * gpx + 'px';
    gridEl.style.width = bw + 'px'; gridEl.style.height = cell * ROWS + 'px';
    $('hud').style.width = $('hud2').style.width = $('boost').style.width = (bw + 16) + 'px';
    slotEls.forEach(s => { s.style.left = s.dataset.c * cell + 'px'; s.style.top = s.dataset.r * cell + 'px'; s.style.width = s.style.height = cell + 'px'; });
    blocks.forEach(b => { if (!b.dead) { posBlock(b); updFill(b); } });
  }

  // ---------- Sand physics ----------
  let flip = 0;
  function step() {
    let moved = 0; flip ^= 1;
    for (let y = HP - 2; y >= 0; y--) {
      const row = y * W, below = row + W;
      for (let n = 0; n < W; n++) {
        const x = flip ? n : W - 1 - n, i = row + x, c = sand[i];
        if (!c) continue;
        let t = -1;
        if (!sand[below + x]) t = below + x;
        else {
          const d = Math.random() < 0.5 ? -1 : 1, x1 = x + d, x2 = x - d;
          if (x1 >= 0 && x1 < W && !sand[below + x1] && !sand[row + x1]) t = below + x1;
          else if (x2 >= 0 && x2 < W && !sand[below + x2] && !sand[row + x2]) t = below + x2;
        }
        if (t >= 0) { sand[t] = c; shade[t] = shade[i]; sand[i] = 0; moved++; }
      }
    }
    return moved;
  }
  let drainTick = 0;
  // Una caja de la fila superior absorbe únicamente los granos de su color
  // expuestos en la base de la arena. Otros colores bloquean la absorción.
  function drain() {
    const touched = new Set();
    for (let x = 0; x < W; x++) {
      const id = occ[0][(x / G) | 0]; if (id < 0) continue;
      const b = blocks[id];
      if (b.dead || b.fill >= b.cap) continue;
      // FIX: La caja solo recoge arena que realmente llega a su abertura.
      // Antes buscaba su color por TODA la columna, incluso detrás de arena
      // de otros colores, y parecía que la atrapaba a distancia.
      let taken = 0;
      for (let y = HP - 1; y >= 0 && taken < 2 && b.fill < b.cap; y--) {
        const i = y * W + x;
        if (!sand[i]) continue;             // El aire no bloquea la caída.
        if (sand[i] !== b.k + 1) break;    // Otra arena tapa el paso.
        sand[i] = 0;
        b.fill++;
        taken++;
        touched.add(b);
      }
    }
    touched.forEach(b => { updFill(b); if (b.fill >= b.cap) clearBlock(b); });
    if (touched.size && ++drainTick % 6 === 0) tone(900 + Math.random() * 500, 0.02, 'sine', 0.012);
  }

  function clearBlock(b) {
    b.dead = true; setOcc(b, -1);
    if (drag && drag.b === b) drag = null;
    b.el.classList.remove('drag');
    b.el.classList.add('pop');
    const gain = b.w * b.h * 10;
    coins += gain; $('coins').textContent = coins; save();
    floatText('+' + gain + ' 🪙', (b.c + b.w / 2) * cell, (b.r + b.h / 2) * cell);
    [660, 880, 1100].forEach((f, j) => tone(f, 0.12, 'triangle', 0.07, j * 0.06));
    setTimeout(() => b.el.remove(), 360);
    if (blocks.every(x => x.dead)) win();
  }
  function floatText(t, x, y) {
    const d = document.createElement('div'); d.className = 'float-txt'; d.textContent = t;
    d.style.left = x + 'px'; d.style.top = y + 'px'; gridEl.appendChild(d); setTimeout(() => d.remove(), 900);
  }

  function render() {
    for (let i = 0; i < W * HP; i++) { const c = sand[i]; buf[i] = c ? PAL[c - 1][shade[i]] : bg[i]; }
    ctx.putImageData(img, 0, 0);
  }

  // ---------- Drag (sliding through empty space) ----------
  let drag = null;
  function fitsAt(b, r, c) {
    if (r < 0 || c < 0 || r + b.h > ROWS || c + b.w > COLS) return false;
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) { const o = occ[r + y][c + x]; if (o >= 0 && o !== b.id) return false; }
    return true;
  }
  function reachable(b) {
    const seen = new Set([b.r + ',' + b.c]), out = [[b.r, b.c]], q = [[b.r, b.c]];
    while (q.length) {
      const [r, c] = q.shift();
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nr = r + dr, nc = c + dc, k = nr + ',' + nc;
        if (!seen.has(k) && fitsAt(b, nr, nc)) { seen.add(k); out.push([nr, nc]); q.push([nr, nc]); }
      }
    }
    return out;
  }
  function startDrag(b, e) {
    if (state !== 'play' || b.dead || drag || mode) return;
    e.preventDefault(); ensureAudio(); clearHint();
    try { b.el.setPointerCapture(e.pointerId); } catch (_) {}
    drag = { b, id: e.pointerId, sx: e.clientX, sy: e.clientY, r0: b.r, c0: b.c, reach: reachable(b) };
    b.el.classList.add('drag');
    tone(420, 0.04, 'sine', 0.05);
  }
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const b = drag.b;
    const tr = drag.r0 + (e.clientY - drag.sy) / cell, tc = drag.c0 + (e.clientX - drag.sx) / cell;
    let best = null, bd = 1e9;
    for (const [r, c] of drag.reach) { const d = (r - tr) ** 2 + (c - tc) ** 2; if (d < bd) { bd = d; best = [r, c]; } }
    if (best && (best[0] !== b.r || best[1] !== b.c)) {
      setOcc(b, -1); b.r = best[0]; b.c = best[1]; setOcc(b, b.id); posBlock(b);
      tone(520, 0.025, 'sine', 0.03);
    }
  }, { passive: true });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.b.el.classList.remove('drag'); drag = null;
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Sound ----------
  let ac = null, muted = false;
  function ensureAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  }
  function tone(f, d = 0.08, type = 'sine', v = 0.1, delay = 0) {
    if (!ac || muted) return;
    try {
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  $('snd').onclick = () => { muted = !muted; $('snd').textContent = muted ? '🔇' : '🔊'; };

  // ---------- Win / lose ----------
  function randBoost() { const k = Object.keys(BOOST); return k[Math.random() * k.length | 0]; }
  function win() {
    state = 'won'; setMode(null); clearHint();
    const bonus = Math.ceil(timeLeft) * 2;
    coins += bonus;
    const items = [`⏱ Tiempo sobrante: +${bonus} 🪙`];
    const t = randBoost(); inv[t]++; items.push(`🎉 Premio: +1 ${BOOST[t].icon} ${BOOST[t].name}`);
    if (level % 5 === 0) {
      coins += 150; const t2 = randBoost(), t3 = randBoost(); inv[t2]++; inv[t3]++;
      items.push(`🧰 ¡Cofre del nivel ${level}! +150 🪙`, `+1 ${BOOST[t2].icon} ${BOOST[t2].name}  ·  +1 ${BOOST[t3].icon} ${BOOST[t3].name}`);
    } else items.push(`🧰 Cofre en el nivel ${Math.ceil((level + 0.5) / 5) * 5}`);
    level++; save(); $('coins').textContent = coins; updBoostUI();
    setTimeout(() => {
      [523, 659, 784, 1047].forEach((f, j) => tone(f, 0.18, 'square', 0.05, j * 0.1));
      showOver('¡Nivel completado!', '<ul class="rewards">' + items.map(x => `<li>${x}</li>`).join('') + '</ul>', 'Siguiente', null);
    }, 500);
  }
  function lose() {
    state = 'lost'; setMode(null); clearHint();
    tone(330, 0.2, 'sawtooth', 0.05); tone(220, 0.35, 'sawtooth', 0.05, 0.18);
    const can = inv.time > 0 || coins >= BOOST.time.price;
    showOver('¡Se acabó el tiempo!', '<p>¿Usas ⏳ para seguir o lo intentas otra vez?</p>', 'Reintentar',
      can ? (inv.time > 0 ? `⏳ +20 seg (tienes ${inv.time})` : `⏳ +20 seg · ${BOOST.time.price} 🪙`) : null);
  }
  function showOver(t, html, b1, b2) {
    $('ovT').textContent = t; $('ovP').innerHTML = html; $('ovB').textContent = b1;
    $('ovB2').textContent = b2 || ''; $('ovB2').classList.toggle('show', !!b2);
    $('over').classList.add('show');
  }
  $('ovB2').onclick = () => {
    if (!consume('time')) return;
    timeLeft = 20; state = 'play'; $('over').classList.remove('show');
    toast('⏳ +20 segundos');
  };
  $('ovB').onclick = () => { ensureAudio(); buildLevel(); };
  $('rst').onclick = () => buildLevel();

  // ---------- Boosters ----------
  let toastT = 0;
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1900); }
  function updBoostUI() {
    document.querySelectorAll('.bst').forEach(btn => {
      const t = btn.dataset.b, c = btn.querySelector('.cnt');
      if (inv[t] > 0) { c.textContent = inv[t]; c.classList.remove('buy'); }
      else { c.textContent = BOOST[t].price + '🪙'; c.classList.add('buy'); }
      btn.classList.toggle('on', mode === t);
    });
    $('coins').textContent = coins;
  }
  function canUse(t) {
    if (inv[t] > 0 || coins >= BOOST[t].price) return true;
    toast(`Te faltan monedas: ${BOOST[t].name} cuesta ${BOOST[t].price} 🪙`); return false;
  }
  function consume(t) {
    if (inv[t] > 0) inv[t]--;
    else if (coins >= BOOST[t].price) coins -= BOOST[t].price;
    else { toast(`Te faltan monedas: ${BOOST[t].name} cuesta ${BOOST[t].price} 🪙`); return false; }
    save(); updBoostUI(); return true;
  }
  function setMode(m) {
    mode = m;
    document.body.classList.toggle('targeting', !!m);
    document.body.classList.toggle('vac', m === 'vac');
    const el = $('mode');
    if (m === 'vac') el.textContent = '🌀 Toca una caja para llenarla al instante';
    else if (m === 'bomb') el.textContent = '💣 Toca donde quieras explotar cajas';
    el.classList.toggle('show', !!m);
    updBoostUI();
  }
  document.querySelectorAll('.bst').forEach(btn => btn.addEventListener('click', () => {
    ensureAudio();
    if (state !== 'play') return;
    const t = btn.dataset.b;
    if (t === 'vac' || t === 'bomb') {
      if (mode === t) return setMode(null);
      if (canUse(t)) { setMode(t); tone(600, 0.06, 'triangle', 0.06); }
      return;
    }
    setMode(null);
    if (t === 'time') { if (consume('time')) { timeLeft += 20; toast('⏳ +20 segundos'); tone(880, 0.1, 'triangle', 0.07); } }
    if (t === 'hint') showHint();
  }));

  // remove n grains of color k from the picture (top-most first) so totals stay exact
  function removeSand(k, n) {
    for (let i = 0; i < W * HP && n > 0; i++) if (sand[i] === k + 1) { sand[i] = 0; n--; }
  }
  function vacuum(b) {
    consume('vac');
    removeSand(b.k, b.cap - b.fill);
    b.fill = b.cap; updFill(b);
    b.el.classList.add('suck');
    [300, 450, 650, 900].forEach((f, j) => tone(f, 0.08, 'sawtooth', 0.03, j * 0.05));
    setTimeout(() => { if (!b.dead) clearBlock(b); }, 300);
  }
  function bomb(r, c) {
    const hit = new Set();
    for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++)
      if (y >= 0 && y < ROWS && x >= 0 && x < COLS && occ[y][x] >= 0) hit.add(blocks[occ[y][x]]);
    if (!hit.size) { toast('No hay cajas ahí'); return; }
    consume('bomb');
    const fx = document.createElement('div'); fx.className = 'boom';
    fx.style.left = (c + 0.5) * cell + 'px'; fx.style.top = (r + 0.5) * cell + 'px';
    gridEl.appendChild(fx); setTimeout(() => fx.remove(), 520);
    const bd = $('board'); bd.classList.remove('shake'); void bd.offsetWidth; bd.classList.add('shake');
    if (ac && !muted) { tone(90, 0.4, 'sawtooth', 0.12); tone(60, 0.5, 'square', 0.08, 0.05); }
    hit.forEach(b => { removeSand(b.k, b.cap - b.fill); b.fill = b.cap; updFill(b); clearBlock(b); });
  }
  gridEl.addEventListener('pointerdown', e => {
    if (!mode || state !== 'play') return;
    e.preventDefault(); e.stopPropagation();
    const rect = gridEl.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / cell), r = Math.floor((e.clientY - rect.top) / cell);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    const m = mode; setMode(null);
    if (m === 'vac') {
      const id = occ[r][c];
      if (id < 0) { toast('Toca una caja'); setMode('vac'); return; }
      vacuum(blocks[id]);
    } else bomb(r, c);
  }, true);

  // hint: best box + spot in the top row that it can actually reach
  let hintEls = [], hintT = 0;
  function clearHint() { if (hintEls[0]) hintEls[0].classList.remove('hinted'); if (hintEls[1]) hintEls[1].remove(); hintEls = []; clearTimeout(hintT); }
  function colCounts() {
    const cnt = Array.from({ length: COLS }, () => ({}));
    for (let i = 0; i < W * HP; i++) { const v = sand[i]; if (v) { const cc = ((i % W) / G) | 0; cnt[cc][v - 1] = (cnt[cc][v - 1] || 0) + 1; } }
    return cnt;
  }
  function showHint() {
    clearHint();
    const cnt = colCounts();
    let best = null;
    for (const b of blocks) {
      if (b.dead) continue;
      for (const [r, c] of reachable(b)) {
        if (r !== 0) continue;
        let n = 0; for (let x = c; x < c + b.w; x++) n += cnt[x][b.k] || 0;
        n = Math.min(n, b.cap - b.fill);
        const already = b.r === 0 && b.c === c;
        if (n > 0 && !already && (!best || n > best.n)) best = { b, r, c, n };
      }
    }
    if (!best) {
      const draining = blocks.some(b => !b.dead && b.r === 0 && [...Array(b.w).keys()].some(x => cnt[b.c + x][b.k]));
      toast(draining ? '💡 Espera: una caja ya se está llenando' : '💡 Libera espacio arriba: mueve cajas hacia abajo o usa 💣');
      return;
    }
    consume('hint');
    const { b, c } = best;
    b.el.classList.add('hinted');
    const g = document.createElement('div'); g.className = 'hintGhost';
    g.style.left = c * cell + 3 + 'px'; g.style.top = '3px';
    g.style.width = b.w * cell - 6 + 'px'; g.style.height = b.h * cell - 6 + 'px';
    gridEl.appendChild(g);
    hintEls = [b.el, g];
    toast('💡 Sube esta caja al cuadro punteado');
    hintT = setTimeout(clearHint, 4000);
  }

  // daily gift
  const today = () => new Date().toISOString().slice(0, 10);
  function giftReady() { try { return localStorage.getItem('arenapop-gift') !== today(); } catch (e) { return false; } }
  function updGift() { $('gift').classList.toggle('ready', giftReady()); }
  $('gift').onclick = () => {
    ensureAudio();
    if (!giftReady()) { toast('🎁 Ya abriste el regalo de hoy. ¡Vuelve mañana!'); return; }
    try { localStorage.setItem('arenapop-gift', today()); } catch (e) {}
    const t = randBoost(); inv[t]++; coins += 100; save(); updBoostUI(); updGift();
    toast(`🎁 Regalo diario: +100 🪙 y +1 ${BOOST[t].icon} ${BOOST[t].name}`);
    [659, 784, 988, 1319].forEach((f, j) => tone(f, 0.15, 'triangle', 0.06, j * 0.08));
  };

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (state === 'play') {
      step(); step();
      drain();
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; lose(); }
      const s = Math.ceil(timeLeft);
      $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      $('timerPill').classList.toggle('low', s <= 10);
    } else step();
    render();
    requestAnimationFrame(loop);
  }

  $('coins').textContent = coins;
  updBoostUI(); updGift();
  window.addEventListener('resize', layout);
  buildLevel();
  requestAnimationFrame(loop);
})();
</script>
<button id="gjBackHome" type="button" aria-label="Regresar al menú GJ Games">← GJ Games</button>
<script>
window.GJBack = function(){ location.href='./index.html'; return true; };
document.getElementById('gjBackHome').addEventListener('click',function(e){e.stopPropagation();window.GJBack()});
